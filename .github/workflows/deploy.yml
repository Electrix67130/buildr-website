# Deploiement Buildr — site vitrine (getbuildr.fr).
#
# Sur push sur main : gate build Next.js, puis SSH sur le VPS et lancement de
# /home/buildr/api/scripts/deploy-web.sh website (git pull + docker build + up).
#
# La vitrine porte les pages legales (/privacy, /cgu, /mentions-legales) dont les
# URLs sont exigees par Apple et Google : un deploiement casse les rend
# inaccessibles, d'ou le gate de build avant toute mise en ligne.
#
# Secrets GitHub requis (Settings -> Secrets and variables -> Actions) :
#   SSH_HOST         IP ou hostname du VPS (ex. 51.15.214.102)
#   SSH_USER         utilisateur de deploiement (= buildr)
#   SSH_PRIVATE_KEY  cle privee SSH dont la publique est dans
#                    ~buildr/.ssh/authorized_keys sur le VPS
#   SSH_PORT         (optionnel) port SSH, defaut 22
# Variable requise pour activer le job deploy :
#   DEPLOY_ENABLED=true (onglet Variables)
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Meme groupe que les autres repos : un seul deploiement a la fois sur le VPS.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  check:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    name: Deploy over SSH
    needs: check
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Run deploy-web.sh on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          script: /home/buildr/api/scripts/deploy-web.sh website
